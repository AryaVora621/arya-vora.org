<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07070c"/>
      <stop offset="100%" style="stop-color:#12141f"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="50%" style="stop-color:#6d28d9"/>
      <stop offset="100%" style="stop-color:#c4b5fd"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#a78bfa" stroke-width="0.5" opacity="0.05">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="url(#accentGrad)" opacity="0.1"/>
  <circle cx="1100" cy="530" r="200" fill="url(#accentGrad)" opacity="0.08"/>
  
  <!-- Main content -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <!-- Badge -->
    <rect x="450" y="80" width="300" height="48" rx="24" fill="#12141f" stroke="#a78bfa" stroke-width="1"/>
    <text x="600" y="112" font-size="16" font-weight="600" fill="#a78bfa">ARYA VORA</text>
    
    <!-- Name -->
    <text x="600" y="220" font-size="72" font-weight="800" fill="white">Arya Vora</text>
    
    <!-- Gradient title -->
    <text x="600" y="300" font-size="48" font-weight="700" fill="url(#textGrad)">Robotics Engineer</text>
    
    <!-- Subtitle -->
    <text x="600" y="360" font-size="28" font-weight="400" fill="#888">FTC 23786 Captain · FRC 2554 Board</text>
    
    <!-- School -->
    <text x="600" y="420" font-size="22" font-weight="500" fill="#c4b5fd">John P. Stevens High School · Edison, NJ</text>
    
    <!-- Footer -->
    <text x="600" y="540" font-size="18" font-weight="400" fill="#666">aryavora.com</text>
  </g>
</svg>
